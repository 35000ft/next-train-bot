[project]
name = "next-train-bot"
version = "0.1.0"
description = "Next Train Bot - QQ机器人"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "aiofiles>=24.1.0",
    "aiohttp>=3.11.12",
    "aiomysql>=0.2.0",
    "APScheduler>=3.11.0",
    "async-lru>=2.0.5",
    "html2image>=2.0.7",
    "httpx>=0.28.1",
    "Jinja2>=3.1.6",
    "lxml>=5.3",
    "numpy>=2.2.4",
    "openpyxl>=3.1.5",
    "pandas>=2.2.3",
    "passlib==1.7.4",
    "bcrypt>=4.0",
    "email-validator>=2.0",
    "pillow>=11.1.0",
    "pydantic>=2.11.1",
    "PyMySQL>=1.1.1",
    "python-dotenv>=1.1.0",
    "PyYAML>=6.0.2",
    "qq-botpy>=1.2.1",
    "requests>=2.32.3",
    "selenium>=4.30.0",
    "SQLAlchemy>=2.0.40",
    "tabulate>=0.9.0",
    "wikipedia>=1.4.0",
    "greenlet>=3.0",
    "china-railway-tools @ git+https://github.com/35000ft/china-railway-tools.git@master",
    "asyncpg>=0.31.0",
    "jieba>=0.42.1",
    "dify-client-python",
]

[tool.uv]
python-preference = "only-system"

[[tool.uv.index]]
url = "https://mirrors.aliyun.com/pypi/simple"
default = true

[tool.uv.sources]
dify-client-python = { git = "https://github.com/Pandaaaa906/dify-client-python.git", rev = "main" }
